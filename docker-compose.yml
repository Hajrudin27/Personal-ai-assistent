services:
  db:
    image: pgvector/pgvector:pg16
    container_name: personal-ai-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: personal_ai
    ports:
      - "55432:5432"
    volumes:
      - personal_ai_db:/var/lib/postgresql/data

volumes:
  personal_ai_db:
